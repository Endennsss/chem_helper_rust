name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
            name: linux-x86_64
          - os: windows-latest
            bundles: nsis
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test -p chem-core --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native application
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/chem-helper-rust.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish verified native artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/prepare-release.mjs release-assets dist
          gh release create "$RELEASE_TAG" dist/* --title "Chem Helper Rust $RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
